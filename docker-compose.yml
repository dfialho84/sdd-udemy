# docker-compose.yml
# Serviços de ambiente local para desenvolvimento e testes.
# Adicione/descomente serviços conforme as features forem exigindo.

services:
  # MySQL 8.0 — banco de dados principal
  mysql:
    image: mysql:8.0.36
    container_name: kanban_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kanban_db
      MYSQL_USER: kanban
      MYSQL_PASSWORD: kanban
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailhog — servidor SMTP de desenvolvimento com interface web
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: kanban_mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  # Jaeger — rastreamento distribuído (all-in-one inclui receptor OTLP)
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: kanban_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  # Prometheus — coleta de métricas
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: kanban_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # Grafana Loki — agregação de logs
  loki:
    image: grafana/loki:2.9.5
    container_name: kanban_loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  # MinIO — armazenamento de objetos para avatares de perfil (feature: registrar-usuario)
  minio:
    image: minio/minio:RELEASE.2024-03-21T23-13-43Z
    container_name: kanban_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console Web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana — dashboards (Jaeger, Prometheus e Loki como data sources)
  grafana:
    image: grafana/grafana:10.4.2
    container_name: kanban_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger

volumes:
  mysql_data:
  loki_data:
  grafana_data:
  minio_data:
